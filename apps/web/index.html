<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Student Copilot</title>
    <meta name="description" content="Learn with an AI tutor, practise with quizzes and vivas, plan your study and track your progress." />
    <meta name="theme-color" content="#f7f5ef" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Copilot" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the saved light/dark choice before the first paint (no white flash). Same rule as src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("copilot-theme");
          if (p !== "light" && !(p === "system" && !window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0b1020");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
