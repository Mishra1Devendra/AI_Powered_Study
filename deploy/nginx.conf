# Production reverse proxy (Nginx): same origin for the web app and the API. Put this in a `server { }` of your TLS-terminating host.
# Replace app.example.com, the web root, the certificate paths and the Supabase host.
# Start the API with:  NODE_ENV=production TRUST_PROXY=true API_HOST=127.0.0.1
# CSP: the one inline script in index.html is allowed by hash. Print it for the build you ship:  npm run csp:hash -w @copilot/web

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-JRkNpRF0/29CX4d2iq0EtK9AQII/S2ECcDMXlanh9n8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://YOUR-PROJECT-REF.supabase.co; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The API (same origin, so no CORS is needed or enabled). Uploads are capped at the app's own limit plus headroom.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a client must not be able to forge its address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;                          # local AI answers can take minutes on a CPU
        client_max_body_size 11m;
        # nginx drops add_header values inside a location that sets its own; repeat the important one.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The built web app with the single-page-app fallback.
    root /var/www/copilot/dist;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
